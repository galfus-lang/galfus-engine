name: Dependency Review

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bindings/**/Cargo.toml'
      - 'engine/**/Cargo.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const basehead = `${context.payload.pull_request.base.sha}...${context.payload.pull_request.head.sha}`;
            try {
              await github.request('GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}', {
                owner,
                repo,
                basehead
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Dependency review skipped because Dependency graph is unavailable for this repository: ${error.message}`);
                core.setOutput('enabled', 'false');
                return;
              }
              throw error;
            }

      - name: Review dependencies
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
