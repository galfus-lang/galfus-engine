name: Dependency Review

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bindings/**/Cargo.toml'
      - 'engine/**/Cargo.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
