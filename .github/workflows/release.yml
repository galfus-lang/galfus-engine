name: Build and Release Engine

on:
  push:
    branches:
      - stable/v*
      - alpha/v*
      - beta/v*
      - next/v*
      - latest/v*
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format pkg-config libasound2-dev libdbus-1-dev libudev-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan1 mesa-vulkan-drivers

      - name: Generate SDKs
        run: bun run codegen

      - name: Prepare formatting tools
        run: bun prepare

      - name: Check formatting
        run: bun run format:check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  build-native:
    name: Build native ${{ matrix.alias }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            alias: linux-x64-gnu
            extension: so
            prefix: lib
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            alias: linux-arm64-gnu
            extension: so
            prefix: lib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            alias: darwin-x64
            extension: dylib
            prefix: lib
          - os: macos-latest
            target: aarch64-apple-darwin
            alias: darwin-arm64
            extension: dylib
            prefix: lib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            alias: windows-x64
            extension: dll
            prefix: ''
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            alias: windows-arm64
            extension: dll
            prefix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        id: version
        run: bun run version

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev libudev-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build FFI library
        run: cargo build --locked --release --package galfus-native --target ${{ matrix.target }}

      - name: Preserve FFI library
        shell: bash
        run: |
          library="${{ matrix.prefix }}galfus_native.${{ matrix.extension }}"
          mkdir -p native-artifacts
          cp "build/cargo-target/${{ matrix.target }}/release/${library}" "native-artifacts/${library}"

      - name: Build Node-API library
        run: cargo build --locked --release --package galfus-native --features napi --target ${{ matrix.target }}

      - name: Generate SDKs
        run: bun run codegen

      - name: Package native release
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.packageVersion }}
        run: |
          package_name="galfus-engine-${PACKAGE_VERSION}-${{ matrix.alias }}"
          package_dir="package/${package_name}"
          library="${{ matrix.prefix }}galfus_native.${{ matrix.extension }}"

          rm -rf package dist
          mkdir -p "${package_dir}/lib" dist
          cp "native-artifacts/${library}" "${package_dir}/lib/${library}"
          cp "build/cargo-target/${{ matrix.target }}/release/${library}" "${package_dir}/lib/galfus.node"
          cp -R sdk "${package_dir}/sdk"
          cp docs/release-package.md "${package_dir}/README.md"

          tar -C package -czf "dist/${package_name}.tar.gz" "${package_name}"
          bun scripts/github/create-md5.ts "dist/${package_name}.tar.gz"
          rm -rf native-artifacts

      - name: Upload native release package
        uses: actions/upload-artifact@v4
        with:
          name: galfus-native-${{ matrix.alias }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-browser:
    name: Build browser WASM
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply release version
        id: version
        run: bun run version

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Build browser binding
        run: cargo build --locked --release --package galfus-browser --target wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        shell: bash
        run: |
          WASM_BINDGEN_VER=$(bun -e "const lock = await Bun.file('Cargo.lock').text(); const match = lock.match(/name = \"wasm-bindgen\"\\s+version = \"([^\"]+)\"/); console.log(match ? match[1] : '0.2.130');")
          echo "Installing wasm-bindgen-cli matching compiled schema version: $WASM_BINDGEN_VER"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VER"

      - name: Package browser release
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.packageVersion }}
        run: |
          package_name="galfus-engine-${PACKAGE_VERSION}-browser-wasm"
          package_dir="package/${package_name}"

          rm -rf package dist
          mkdir -p "${package_dir}/browser" dist
          wasm-bindgen \
            --target web \
            --out-dir "${package_dir}/browser" \
            --out-name galfus_browser \
            build/cargo-target/wasm32-unknown-unknown/release/galfus_browser.wasm
          cp docs/release-package.md "${package_dir}/README.md"

          tar -C package -czf "dist/${package_name}.tar.gz" "${package_name}"
          bun scripts/github/create-md5.ts "dist/${package_name}.tar.gz"

      - name: Upload browser release package
        uses: actions/upload-artifact@v4
        with:
          name: galfus-browser-wasm
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-packages:
    name: Build & Publish Packages
    needs:
      - build-native
      - build-browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node for NPM Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Upgrade npm to latest for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply release version
        id: version
        run: bun run version

      - name: Generate SDKs and sync host packages
        run: bun run codegen

      - name: Download native and browser artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: galfus-*
          merge-multiple: true

      - name: Assemble transport distributions
        shell: bash
        run: |
          mkdir -p host/transport-bun/dist host/transport-node/dist host/transport-browser/dist

          for pkg in artifacts/*.tar.gz; do
            if [[ "$pkg" == *"browser-wasm"* ]]; then
              tar -xzf "$pkg"
              dir=$(basename "$pkg" .tar.gz)
              mkdir -p host/transport-browser/dist
              cp "$dir/browser/"* host/transport-browser/dist/ 2>/dev/null || true
              rm -rf "$dir"
            else
              if [[ "$pkg" == *"-linux-x64-gnu.tar.gz" ]]; then
                platform="linux-x64"
              elif [[ "$pkg" == *"-linux-arm64-gnu.tar.gz" ]]; then
                platform="linux-arm64"
              elif [[ "$pkg" == *"-darwin-x64.tar.gz" ]]; then
                platform="macos-x64"
              elif [[ "$pkg" == *"-darwin-arm64.tar.gz" ]]; then
                platform="macos-arm64"
              elif [[ "$pkg" == *"-windows-x64.tar.gz" ]]; then
                platform="windows-x64"
              elif [[ "$pkg" == *"-windows-arm64.tar.gz" ]]; then
                platform="windows-arm64"
              else
                echo "Skipping non-matching package: $pkg"
                continue
              fi

              tar -xzf "$pkg"
              dir=$(basename "$pkg" .tar.gz)

              # 1. Transport Node: exclusively Node-API binaries (*.node)
              mkdir -p "host/transport-node/dist/${platform}"
              if [ -f "$dir/lib/galfus.node" ]; then
                cp "$dir/lib/galfus.node" "host/transport-node/dist/${platform}/galfus.node"
              fi

              # 2. Transport Bun: exclusively dynamic libraries (*.so, *.dylib, *.dll)
              mkdir -p "host/transport-bun/dist/${platform}"
              case "$platform" in
                linux-*)
                  if [ -f "$dir/lib/libgalfus_native.so" ]; then
                    cp "$dir/lib/libgalfus_native.so" "host/transport-bun/dist/${platform}/libgalfus_native.so"
                  fi
                  ;;
                macos-*)
                  if [ -f "$dir/lib/libgalfus_native.dylib" ]; then
                    cp "$dir/lib/libgalfus_native.dylib" "host/transport-bun/dist/${platform}/libgalfus_native.dylib"
                  fi
                  ;;
                windows-*)
                  if [ -f "$dir/lib/galfus_native.dll" ]; then
                    cp "$dir/lib/galfus_native.dll" "host/transport-bun/dist/${platform}/galfus.dll"
                    cp "$dir/lib/galfus_native.dll" "host/transport-bun/dist/${platform}/galfus_native.dll"
                  fi
                  ;;
              esac

              rm -rf "$dir"
            fi
          done

      - name: Publish all packages to NPM (Trusted Publishing / OIDC)
        run: |
          tag="${{ steps.version.outputs.tag }}"
          echo "Publishing packages with tag: $tag (Trusted Publishing / Provenance enabled)"
          for pkg in host/transport-types host/model-loader-types host/transport-bun host/transport-node host/transport-browser host/engine host/gltf-loader; do
            echo "==> Publishing $pkg..."
            (cd "$pkg" && npm publish --provenance --access public --tag "$tag")
          done

  release:
    name: Publish GitHub Release
    needs:
      - build-native
      - build-browser
      - publish-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve release version
        id: version
        run: bun run version

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: galfus-*
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          for checksum in artifacts/*.md5; do
            (cd "$(dirname "${checksum}")" && md5sum -c "$(basename "${checksum}")")
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.packageVersion }}
          name: v${{ steps.version.outputs.packageVersion }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.md5
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref_name, 'stable/') }}

      - name: Delete temporary workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            await Promise.all(
              artifacts
                .filter((artifact) => artifact.name.startsWith('galfus-'))
                .map((artifact) =>
                  github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  })
                )
            );
