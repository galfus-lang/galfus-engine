name: Build and Release Engine

on:
  push:
    branches:
      - stable/v*
      - alpha/v*
      - beta/v*
      - next/v*
      - latest/v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev libudev-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Verify generated SDKs
        run: |
          bun run codegen
          git diff --exit-code -- sdk

  build-native:
    name: Build native ${{ matrix.alias }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            alias: linux-x64
            extension: so
            prefix: lib
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            alias: linux-arm64
            extension: so
            prefix: lib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            alias: macos-x64
            extension: dylib
            prefix: lib
          - os: macos-latest
            target: aarch64-apple-darwin
            alias: macos-arm64
            extension: dylib
            prefix: lib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            alias: windows-x64
            extension: dll
            prefix: ''
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            alias: windows-arm64
            extension: dll
            prefix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply release version
        run: bun run version

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev libudev-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build FFI library
        run: cargo build --locked --release --package galfus-native --target ${{ matrix.target }}

      - name: Prepare FFI artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "build/cargo-target/${{ matrix.target }}/release/${{ matrix.prefix }}galfus_native.${{ matrix.extension }}" "dist/galfus-native-ffi-${{ matrix.alias }}.${{ matrix.extension }}"

      - name: Build Node-API library
        run: cargo build --locked --release --package galfus-native --features napi --target ${{ matrix.target }}

      - name: Prepare Node-API artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "build/cargo-target/${{ matrix.target }}/release/${{ matrix.prefix }}galfus_native.${{ matrix.extension }}" "dist/galfus-native-napi-${{ matrix.alias }}.node"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galfus-native-${{ matrix.alias }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-browser:
    name: Build browser WASM
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply release version
        run: bun run version

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Build browser binding
        run: cargo build --locked --release --package galfus-browser --target wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Generate browser package
        run: |
          wasm-bindgen \
            --target web \
            --out-dir dist/galfus-browser-web \
            --out-name galfus_browser \
            build/cargo-target/wasm32-unknown-unknown/release/galfus_browser.wasm

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galfus-browser-web
          path: dist/galfus-browser-web
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs:
      - build-native
      - build-browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: bun run version

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: galfus-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.packageVersion }}
          name: v${{ steps.version.outputs.packageVersion }}
          files: artifacts/**
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref_name, 'stable/') }}
