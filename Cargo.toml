[workspace]
members = [
    "engine/*",
    "bindings/*",
]
default-members = ["bindings/galfus-native"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared external crates
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
thiserror = "2.0"
glam = { version = "0.33", features = ["serde", "bytemuck"] }

log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "28.0"
rhai = { version = "1.27.0", default-features = false, features = ["std", "f32_float", "sync"] }
rapier2d = { version = "0.36", features = ["serde-serialize"] }
rapier3d = { version = "0.36", features = ["serde-serialize"] }
pollster = "0.4"
lyon_tessellation = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
web-sys = "0.3"

# Internal workspace crates
galfus-core = { path = "engine/galfus-core" }
galfus-multiverse = { path = "engine/galfus-multiverse" }
galfus-realm-core = { path = "engine/galfus-realm-core" }
galfus-physics = { path = "engine/galfus-physics" }
galfus-platform = { path = "engine/galfus-platform", default-features = false }

galfus-gpu-manager = { path = "engine/galfus-gpu-manager" }
galfus-realm-2d = { path = "engine/galfus-realm-2d" }
galfus-realm-3d = { path = "engine/galfus-realm-3d" }
galfus-realm-2d-resources = { path = "engine/galfus-realm-2d-resources" }
galfus-realm-3d-resources = { path = "engine/galfus-realm-3d-resources" }
galfus-animation = { path = "engine/galfus-animation" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
