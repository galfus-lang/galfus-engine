[workspace]
members = [
    "engine/*",
    "bindings/*",
]
default-members = ["bindings/galfus-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared external crates
thiserror = "2.0"
glam = "0.30"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }

# Internal workspace crates
galfus-core = { path = "engine/galfus-core" }
galfus-multiverse = { path = "engine/galfus-multiverse" }
galfus-realm-core = { path = "engine/galfus-realm-core" }
galfus-platform = { path = "engine/galfus-platform" }
galfus-gpu-manager = { path = "engine/galfus-gpu-manager" }
galfus-realm-2d = { path = "engine/galfus-realm-2d" }
galfus-realm-3d = { path = "engine/galfus-realm-3d" }
galfus-realm-2d-resources = { path = "engine/galfus-realm-2d-resources" }
galfus-realm-3d-resources = { path = "engine/galfus-realm-3d-resources" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

